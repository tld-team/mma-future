[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mma-future-scraper"
version = "0.1.0"
description = "Standalone Tapology FightCenter scraper for MMA Future data discovery"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.44",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mma_future_scraper = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
