# BEGIN MMAF OPERATIONS -- must precede WordPress and page-cache rules.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteRule ^\.mmaf-maintenance$ - [F,END]
RewriteRule ^\.well-known/mmaf-release\.json$ - [END]
# Loopback probes enter PHP before cache rules. PHP also verifies the private token.
RewriteCond %{DOCUMENT_ROOT}/.mmaf-maintenance -f
RewriteCond %{REMOTE_ADDR} ^(?:127\.0\.0\.1|::1)$
RewriteCond %{HTTP:X-MMAF-Release-Probe} ^[a-f0-9]{64}$
RewriteRule ^(?:$|all-rankings/?$|wp-json/.*)$ index.php [END]
RewriteCond %{DOCUMENT_ROOT}/.mmaf-maintenance -f
RewriteCond %{REMOTE_ADDR} !^(?:127\.0\.0\.1|::1)$ [OR]
RewriteCond %{HTTP:X-MMAF-Release-Probe} !^[a-f0-9]{64}$
RewriteRule ^ - [R=503,END,E=MMAF_MAINTENANCE:1]
</IfModule>
<IfModule mod_headers.c>
Header always set Retry-After "60" env=MMAF_MAINTENANCE
Header always set Cache-Control "no-store" env=MMAF_MAINTENANCE
</IfModule>
# END MMAF OPERATIONS
